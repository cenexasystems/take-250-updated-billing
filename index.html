    <!-- Early Exception & Extension Channel Error Guard -->
    <script>
      (function() {
        var isBenign = function(msg, source) {
          if (!msg && !source) return false;
          var s = String(msg || '') + ' ' + String(source || '');
          return (
            s.indexOf('disconnected port object') !== -1 ||
            s.indexOf('Attempting to use a disconnected port object') !== -1 ||
            s.indexOf('proxy.js') !== -1 ||
            s.indexOf('handleMessageFromPage') !== -1 ||
            s.indexOf('message channel closed before a response was received') !== -1 ||
            s.indexOf('The message port closed before a response was received') !== -1 ||
            s.indexOf('A listener indicated an asynchronous response') !== -1 ||
            s.indexOf('Extension context invalidated') !== -1 ||
            s.indexOf('Could not establish connection. Receiving end does not exist') !== -1 ||
            s.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
            s.indexOf('ResizeObserver loop limit exceeded') !== -1 ||
            s.indexOf('Non-Error promise rejection captured') !== -1 ||
            s.indexOf('Permissions policy violation: unload') !== -1 ||
            s.indexOf('unload is not allowed in this document') !== -1 ||
            s.indexOf('Using DEFAULT root logger') !== -1 ||
            s.indexOf('non-precached-url') !== -1
          );
        };

        // Proactively unregister any crashed or stale Service Worker registrations and purge workbox caches
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var j = 0; j < names.length; j++) {
                  caches.delete(names[j]);
                }
              }).catch(function() {});
            }
          } catch(e) {}
        }


        window.onerror = function(message, source, lineno, colno, error) {
          var errStr = (error && (error.message || error.stack)) || '';
          if (isBenign(message, source) || isBenign(errStr, source)) {
            return true; // Suppresses uncaught error display in browser console
          }
        };

        window.onunhandledrejection = function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || reason)) || '';
          if (isBenign(msg, '')) {
            event.preventDefault();
            return true;
          }
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || reason)) || '';
          if (isBenign(msg, '')) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var target = event.target;
          // Self-healing recovery if a stale hashed stylesheet fails to load after a new deployment
          if (target && target.tagName === 'LINK' && target.rel === 'stylesheet') {
            var key = 'yg_css_recover_ts';
            var last = sessionStorage.getItem(key);
            var now = Date.now();
            if (!last || now - Number(last) > 8000) {
              sessionStorage.setItem(key, String(now));
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) regs[i].unregister();
                  if ('caches' in window) {
                    caches.keys().then(function(names) {
                      for (var j = 0; j < names.length; j++) caches.delete(names[j]);
                      window.location.reload();
                    });
                  } else {
                    window.location.reload();
                  }
                });
              } else {
                window.location.reload();
              }
            }
            return;
          }

          var msg = event.message || (event.error && (event.error.message || event.error.stack)) || '';
          var src = event.filename || '';
          if (isBenign(msg, src)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);

        // Filter benign extension warnings from console
        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (arguments[i] && isBenign(arguments[i], '')) return;
          }
          return origWarn.apply(console, arguments);
        };
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (arguments[i] && isBenign(arguments[i], '')) return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
